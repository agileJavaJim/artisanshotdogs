<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find The Trailer</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; padding: 40px; }
        #map { height: 400px; width: 100%; max-width: 800px; border-radius: 15px; border: 2px solid #ff0000; }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY_HERE&libraries=marker"></script>
</head>
<body>
    <div id="map"></div>

    <script>
        async function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 17,
                mapId: "DEMO_MAP_ID"
            });
            const marker = new google.maps.marker.AdvancedMarkerElement({ map });

            async function updateLocation() {
                try {
                    const response = await fetch("YOUR_CSV_URL_HERE");
                    const csvText = await response.text();
                    const rows = csvText.split('\n');
                    const values = rows[1].split(',');
                    const pos = { lat: parseFloat(values[0]), lng: parseFloat(values[1]) };
                    
                    marker.position = pos;
                    map.setCenter(pos);
                } catch (e) { console.error("Error updating location", e); }
            }
            updateLocation();
        }
        window.onload = initMap;
    </script>
</body>
</html>
