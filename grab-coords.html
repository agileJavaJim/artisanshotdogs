<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Grabber | Artisans Hot Dogs</title>
    <!-- Jim's private tool — NOT linked from the site nav. Bookmark it on your phone. -->
    <style>
        * { box-sizing: border-box; }
        body {
            background: #1a1a1a; color: #F5E6CA;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }
        .card {
            background: #4A1521; border: 2px solid #D4AF37; border-radius: 15px;
            padding: 30px 25px; max-width: 420px; width: 100%;
            text-align: center; margin-top: 40px;
        }
        h1 { color: #D4AF37; margin-top: 0; font-size: 1.5rem; }
        .hint { color: #e3d7c1; font-size: 0.95rem; }
        button {
            background: #D4AF37; color: #4A1521; border: none; border-radius: 10px;
            padding: 15px 25px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; margin: 10px 5px;
        }
        button:active { transform: scale(0.97); }
        #grab { width: 100%; font-size: 1.25rem; }
        .coord {
            background: #1a1a1a; border: 1px solid #D4AF37; border-radius: 10px;
            padding: 12px; margin: 10px 0;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .coord span { font-size: 0.85rem; color: #e3d7c1; }
        .coord strong { font-size: 1.15rem; color: #fff; font-family: monospace; }
        .coord button { padding: 8px 14px; font-size: 0.9rem; margin: 0; }
        #status { min-height: 1.5em; color: #e3d7c1; }
        #acc { font-size: 0.85rem; color: #e3d7c1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📍 Trailer Location Grabber</h1>
        <p class="hint">Stand at the trailer, tap the button, paste into your sheet.</p>
        <button id="grab">Grab My Location</button>
        <p id="status"></p>
        <div id="result" hidden>
            <div class="coord">
                <span>Latitude</span><strong id="lat">—</strong>
                <button data-copy="lat">Copy</button>
            </div>
            <div class="coord">
                <span>Longitude</span><strong id="lng">—</strong>
                <button data-copy="lng">Copy</button>
            </div>
            <p id="acc"></p>
            <button id="copyBoth">Copy Both</button>
        </div>
        <p class="hint">Paste into <b>row 2</b> of your "Location Coordinates" sheet.<br>The website pin follows within 5 minutes.</p>
    </div>

    <script>
        const statusEl = document.getElementById("status");
        let lat = null, lng = null;

        document.getElementById("grab").addEventListener("click", () => {
            if (!navigator.geolocation) {
                statusEl.textContent = "This browser won't share location — open this page over HTTPS.";
                return;
            }
            statusEl.textContent = "Locating… stand still a moment.";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    lat = pos.coords.latitude.toFixed(6);
                    lng = pos.coords.longitude.toFixed(6);
                    document.getElementById("lat").textContent = lat;
                    document.getElementById("lng").textContent = lng;
                    document.getElementById("acc").textContent =
                        "Accurate to about " + Math.round(pos.coords.accuracy) + " meters.";
                    document.getElementById("result").hidden = false;
                    statusEl.textContent = "Got it! Copy and paste into your sheet.";
                },
                (err) => {
                    statusEl.textContent = "Couldn't get your location: " + err.message +
                        " — allow location access for this site and try again.";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });

        async function copyText(t, btn) {
            if (!t) return;
            try {
                await navigator.clipboard.writeText(t);
            } catch (e) {
                // Fallback for older browsers
                const ta = document.createElement("textarea");
                ta.value = t; document.body.appendChild(ta); ta.select();
                document.execCommand("copy"); ta.remove();
            }
            const old = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = old; }, 1500);
        }

        document.querySelectorAll("[data-copy]").forEach((b) =>
            b.addEventListener("click", () =>
                copyText(b.dataset.copy === "lat" ? lat : lng, b)));

        document.getElementById("copyBoth").addEventListener("click", (e) =>
            copyText(lat + ", " + lng, e.target));
    </script>
</body>
</html>
