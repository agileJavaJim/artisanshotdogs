<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Trailer | Artisans Hot Dogs</title>

    <link rel="stylesheet" href="style.css">

    <!-- Leaflet map library (free, no API key needed) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* Fallback layout in case style.css doesn't cover the map page */
        #map { width: 100%; height: 70vh; min-height: 400px; border-radius: 15px; z-index: 1; }
        #location-status {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #e3d7c1; text-align: center;
            margin: 15px 0; font-size: 1rem;
        }
        /* Custom burgundy & gold pin (overrides Leaflet's default divIcon look) */
        .ahd-pin { background: none; border: none; }
        .ahd-pin-circle {
            width: 32px; height: 32px;
            background: #4A1521;               /* burgundy hub */
            border: 3px solid #F5E6CA;         /* cream rim */
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .ahd-pin-dot {
            width: 12px; height: 12px;
            background: #D4AF37;               /* gold center */
            border-radius: 50%;
        }
        /* Dark popup to match the theme */
        .leaflet-popup-content-wrapper { background: #4A1521; color: #F5E6CA; border: 1px solid #D4AF37; }
        .leaflet-popup-content { font-family: 'Segoe UI', sans-serif; }
        .leaflet-popup-tip { background: #4A1521; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Where to Find Us</h1>
        <div id="map"></div>
        <p id="location-status">Locating the trailer&hellip;</p>
        <a href="index.html" class="back-btn">&larr; Back to Home</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        /* ============================================================
           CONFIG — the only things you ever need to touch
           ============================================================ */
        // Your "Location Coordinates" Google Sheet ID.
        // Sheet must be shared as "Anyone with the link can view".
        // Layout: Location | Latitude | Longitude | Notes.
        // The FIRST location row (row 2) is the live spot.
        const SHEET_ID = "1wqglrPFhLMv5lUDNK8eYdAe89QXk9cCwd1qaofptODg";

        // How often the page re-checks the sheet (minutes)
        const REFRESH_MINUTES = 5;

        // Shown if the sheet can't be reached — your Ironton Base
        const FALLBACK_LOCATION = [38.5342, -82.6821];

        /* ============================================================
           Reads the published sheet and returns [lat, lng]
           ============================================================ */
        async function fetchSheetLocation() {
            const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";
            const response = await fetch(url);
            if (!response.ok) throw new Error("Sheet fetch failed: " + response.status);
            const csvText = await response.text();
            for (const row of csvText.trim().split("\n")) {
                const nums = row.split(",")
                    .map(v => v.trim().replace(/^"|"$/g, ""))
                    .map(v => parseFloat(v))
                    .filter(n => Number.isFinite(n));
                if (nums.length >= 2) return [nums[0], nums[1]];
            }
            throw new Error("No coordinates found in sheet");
        }

        /* ============================================================
           Map setup — dark tiles that match your burgundy & gold theme
           ============================================================ */
        const map = L.map("map").setView(FALLBACK_LOCATION, 15);

        // Free dark tiles from Esri (no API key needed).
        // NOTE: Esri uses {z}/{y}/{x} order — don't "fix" it to x/y.
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
            attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ",
            maxZoom: 16
        }).addTo(map);

        const pinIcon = L.divIcon({
            className: "ahd-pin",
            html: '<div class="ahd-pin-circle"><div class="ahd-pin-dot"></div></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        const marker = L.marker(FALLBACK_LOCATION, {
            icon: pinIcon,
            title: "Artisans Hot Dogs"
        }).addTo(map);
        marker.bindPopup("<b>Artisans Hot Dogs</b><br>Come hungry. 🌭");

        /* ============================================================
           Live location updates from the sheet
           ============================================================ */
        const statusEl = document.getElementById("location-status");

        async function updateLocation() {
            try {
                const pos = await fetchSheetLocation();
                marker.setLatLng(pos);
                map.setView(pos, 15);
                statusEl.textContent = "Trailer location updated " + new Date().toLocaleTimeString();
            } catch (e) {
                console.warn("Live location unavailable, using fallback:", e);
                statusEl.textContent = "Showing our usual spot — live location coming soon.";
            }
        }

        updateLocation();
        setInterval(updateLocation, REFRESH_MINUTES * 60 * 1000);
    </script>
</body>
</html>
